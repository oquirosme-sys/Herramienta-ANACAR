<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba del motor de cálculo</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 1rem; background: #fff; color: #1d2733; }
    table { border-collapse: collapse; font-size: 12px; } td, th { border: 1px solid #ccc; padding: 2px 6px; text-align: right; }
    .ok { color: #1b7f4b; } .bad { color: #b42318; font-weight: 600; } h2 { font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>Motor de cálculo vs. Excel (bloque Machote de ANACAR)</h1>
  <p id="sum"></p>
  <div id="out"></div>
  <script src="../js/data/seed.js"></script>
  <script src="../js/calc.js"></script>
  <script src="machote.js"></script>
  <script>
    const out = document.getElementById('out'), fails = [];
    let total = 0;
    const eq = (a, b) => {
      if ((a === null || a === undefined || a === '' || a === ' ') && (b === null || b === undefined || b === '' || b === ' ')) return true;
      if (typeof b === 'number' && a !== null && a !== '' && !isNaN(Number(a))) return Math.abs(Number(a) - b) < 1e-6 * Math.max(1, Math.abs(b));
      return String(a).trim() === String(b).trim();
    };
    function check(nombre, real, esperado) { total++; const ok = eq(real, esperado); if (!ok) fails.push([nombre, real, esperado]); return ok; }

    const P = { tableros: [MACHOTE.tablero], cvMaxTotal: 5, iccLongMax: 20 };
    const R = Calc.proyecto(P, window.SEED).orden[0];
    const E = MACHOTE.esperado;
    MACHOTE.tablero.circuitos.forEach((cc, i) => {
      const x = R.rows.find(r => r.c.id === cc.id), e = E.circuitos[i];
      check('c' + i + ' U', x.fase[0], e.U); check('c' + i + ' V', x.fase[1], e.V); check('c' + i + ' W', x.fase[2], e.W);
      check('c' + i + ' AA', x.I[0], e.AA); check('c' + i + ' AE', x.AE, e.AE); check('c' + i + ' AF', x.AF, e.AF);
      check('c' + i + ' AL', x.AL, e.AL); check('c' + i + ' AN', x.AN, e.AN); check('c' + i + ' AP', x.AP, e.AP); check('c' + i + ' AR', x.AR, e.AR);
      check('c' + i + ' AS', x.AS, e.AS); check('c' + i + ' AT', x.AT, e.AT); check('c' + i + ' AU', x.AU, e.AU); check('c' + i + ' AV', x.AV, e.AV); check('c' + i + ' AY', x.AY, e.AY);
    });
    const T = E.totales, A = R.alim;
    [['J116', R.J116], ['U116', R.U116[0]], ['V116', R.U116[1]], ['W116', R.U116[2]], ['U118', R.desbalance], ['W128', R.W128], ['W129', R.W129], ['W130', R.W130],
     ['J134', R.J134], ['K131', R.tipos.find(t => t.tipo.id === 2).fd], ['L139', A.L139], ['R139', A.R139], ['AA139', A.AA139[0]], ['AB139', A.AA139[1]], ['AC139', A.AA139[2]],
     ['AE139', A.AE139], ['AF139', A.AF139], ['AL139', A.AL139], ['AN139', A.AN139], ['AP139', A.AP139], ['AP140', A.AP140], ['AR139', A.AR139], ['AS139', A.AS139], ['AT139', A.AT139],
     ['AV139', A.AV139], ['AW139', A.AW139], ['AX139', A.AX139], ['AY139', A.AY139], ['AW140', A.AW140], ['BA139', R.bkMain && R.bkMain.modelo], ['BJ11', R.cat && R.cat.modelo],
     ['BJ16', R.spd && R.spd.modelo], ['AJ10', A.ampCond * A.tempF * A.agrF], ['AE10', A.ampReq]]
      .forEach(([k, v]) => check(k, v, T[k]));

    // Cascada: un tablero derivado debe partir del voltaje en bornes del principal y acumular su caída
    const hijo = { id: 't2', prefijo: 'TABLERO', nombre: 'TB', fases: 3, voltaje: 208, hilos: 4, sistema: '120/208', reserva: 0, longitud: 30, padreId: 't1', alim: { material: 'CU', aislamiento: 'THHN' },
      circuitos: [{ id: 'h1', polos: [1], detalleId: 8, kva: 1.5, longitud: 15 }, { id: 'h2', polos: [2], detalleId: 8, kva: 1.5, longitud: 15 }] };
    const padre = JSON.parse(JSON.stringify(MACHOTE.tablero)); padre.circuitos.push({ id: 'x', polos: [61, 63, 65], detalleId: 19, tableroHijoId: 't2', longitud: 30 });
    const Q = Calc.proyecto({ tableros: [padre, hijo], cvMaxTotal: 5, iccLongMax: 20 }, window.SEED);
    const rp = Q.res.t1, rh = Q.res.t2;
    check('Cascada: inicio del hijo = bornes del padre', rh.alim.vInicio, rp.alim.AW139);
    check('Cascada: caída acumulada del hijo > padre', rh.alim.AY139 > rp.alim.AY139, true);
    check('Cascada: kVA del circuito = kVA totales del hijo', rp.rows.find(x => x.c.id === 'x').J, rh.W130);
    check('Cascada: Icc del hijo < Icc del padre', rh.iccA < rp.iccA, true);
    check('Cascada: el hijo nombra a su padre', rh.alimentadoDesde, 'TABLERO Machote');


    // Transformador 750 kVA, Z 5,75 % desde red infinita: secundario = KACC del Excel (DATOS, 36 206 A) y en bornes = AQ10 (5 721,7 A)
    const close = (a, b, tol) => Math.abs(a - b) <= tol * Math.abs(b);
    const tt = JSON.parse(JSON.stringify(MACHOTE.tablero)); tt.iccManual = ''; tt.trafo = { activo: true, kva: 750, z: 5.75 };
    const RT = Calc.proyecto({ tableros: [tt], cvMaxTotal: 5, iccLongMax: 20 }, window.SEED).orden[0];
    check('Transformador: Icc secundario ≈ 36 206 A', close(RT.trafo.iccSec, 36206, 0.0005), true);
    check('Transformador: Icc en bornes ≈ AQ10 del Excel', close(RT.iccA, 5721.655187998049, 0.0005), true);
    // Reglas de fabricante: tablero NQ 208 V con 15 kA → ramal 1P 20 A debe ser QOB-VH (22 kA), no QOB (10 kA)
    const tq = { id: 'q', nombre: 'Q', tipo: '3F', fases: 3, voltaje: 208, hilos: 4, sistema: '120/208', reserva: 0, longitud: 10, iccManual: 15, marca: 'Square D', alim: {},
      circuitos: [{ id: 'q1', polos: [1], detalleId: 8, kva: 1, longitud: 10 }] };
    const RQ = Calc.proyecto({ tableros: [tq], cvMaxTotal: 5, reservaEspacios: 20 }, window.SEED).orden[0];
    check('Reglas: familia del tablero', RQ.famT && RQ.famT.familia, 'NQ');
    check('Reglas: breaker ramal por SCCR', RQ.rows[0].breaker && RQ.rows[0].breaker.ref, 'QOB120VH');
    // Autobalanceo: todo en fase A debe repartirse
    const tb = { id: 'b', tipo: '3F', fases: 3, voltaje: 208, circuitos: [1, 7, 13, 19].map((p, i) => ({ id: 'b' + i, polos: [p], detalleId: 8, kva: 1 })) };
    const B = Calc.balanceo(tb, window.SEED, { espacios: 30 });
    check('Autobalanceo: desbalance inicial 100 %', B.antes, 100);
    check('Autobalanceo: mejora el desbalance', B.despues < 60, true);
    check('Autobalanceo: lista de cambios', B.cambios.length >= 2, true);


    // Serie (240.86): tablero CH con principal PDG2…G (65 kA) y Icc 30 kA → ramal BAB de 10 kA aceptado en serie
    const ts = { id: 's', nombre: 'S', tipo: '3F', fases: 3, voltaje: 208, hilos: 4, sistema: '120/208', reserva: 0, longitud: 5, iccManual: 30, marca: 'Eaton', catalogoId: 95, alim: { prot: 100, breakerId: 14 },
      circuitos: [{ id: 's1', polos: [1], detalleId: 8, kva: 1, longitud: 10, unidad: 'STD' }] };
    const RS = Calc.proyecto({ tableros: [ts], cvMaxTotal: 5 }, window.SEED).orden[0];
    check('Serie: principal PDG2 G', /^PDG23G/.test(RS.bkMain.ref), true);
    check('Serie: ramal BAB aceptado en serie', !!(RS.rows[0].breaker.serie && !RS.rows[0].breaker.sccrBajo), true);
    // NEC 2020: vivienda → baño GFCI y habitación AFCI
    const tv = { id: 'v', nombre: 'V', tipo: '3F', fases: 3, voltaje: 208, hilos: 4, sistema: '120/208', reserva: 0, longitud: 5, iccManual: 5, marca: 'Eaton', alim: {},
      circuitos: [{ id: 'v1', polos: [1], detalleId: 8, kva: 1, longitud: 10, descripcion: 'Tomacorrientes baño' }, { id: 'v2', polos: [3], detalleId: 8, kva: 1, longitud: 10, descripcion: 'Tomacorrientes habitación' }] };
    const RV = Calc.proyecto({ tableros: [tv], cvMaxTotal: 5, ocupacion: 'vivienda' }, window.SEED).orden[0];
    check('NEC 210.8: baño GFCI', RV.rows[0].breaker.unidad, 'GFCI');
    check('NEC 210.12: habitación AFCI', RV.rows[1].breaker.unidad, 'AFCI');
    check('Catálogo GFCI Eaton', RV.rows[0].breaker.ref, 'QBGF1020');


    // Factores: la diversidad del tablero divide la demanda; 100 % rated; bypass sin carga; orden impar/par
    const td = JSON.parse(JSON.stringify(MACHOTE.tablero)); td.fdivTablero = 1.25;
    const RD = Calc.proyecto({ tableros: [td], cvMaxTotal: 5 }, window.SEED).orden[0];
    check('Diversidad del tablero divide', Math.abs(RD.alim.L139 - T.L139 / 1.25) < 1e-9, true);
    const t1 = JSON.parse(JSON.stringify(MACHOTE.tablero)); t1.catalogoId = ''; t1.marca = 'Eaton'; t1.alim = { rated100: true }; t1.iccManual = 10;
    const R1 = Calc.proyecto({ tableros: [t1], cvMaxTotal: 5 }, window.SEED).orden[0];
    check('100 % rated: protección con la carga al 100 %', R1.alim.AD139, 1);
    check('100 % rated: modelo PDF', /^PDF/.test(R1.bkMain.ref), true);
    const tbA = { id: 'ba', nombre: 'A', tipo: '3F', fases: 3, voltaje: 208, hilos: 4, sistema: '120/208', reserva: 0, longitud: 5, iccManual: 10, alim: {}, circuitos: [{ id: 'a1', polos: [1], detalleId: 8, kva: 2, longitud: 5 }, { id: 'a2', polos: [3, 5, 7], detalleId: 19, kva: 0, longitud: 5, respaldoDe: 'bb' }] };
    const tbB = { id: 'bb', nombre: 'B', tipo: '3F', fases: 3, voltaje: 208, hilos: 4, sistema: '120/208', reserva: 0, longitud: 5, alterna: { activo: true, tipo: 'tablero', origenId: 'ba', equipo: 'MTS', longitud: 10 }, alim: {}, circuitos: [{ id: 'b1', polos: [1], detalleId: 8, kva: 5, longitud: 5 }] };
    const RB = Calc.proyecto({ tableros: [tbA, tbB], cvMaxTotal: 5 }, window.SEED);
    check('Bypass: circuito dimensionado con la carga del respaldado', RB.res.ba.rows.find(x => x.c.id === 'a2').J, 5);
    check('Bypass: no suma carga en el origen', RB.res.ba.J116, 2);
    check('Bypass: segunda acometida con Icc', RB.res.bb.alterna.iccA > 0, true);
    check('Orden físico: impares y luego pares', R.rows.map(x => x.polos[0] % 2).join('').indexOf('01') === -1, true);

    document.getElementById('sum').innerHTML = fails.length ? '<b class="bad">' + fails.length + ' de ' + total + ' comprobaciones fallaron</b>' : '<b class="ok">' + total + ' de ' + total + ' comprobaciones correctas</b>';
    out.innerHTML = fails.length ? '<table><tr><th>Valor</th><th>Herramienta</th><th>Excel</th></tr>' + fails.map(f => '<tr><td style="text-align:left">' + f[0] + '</td><td>' + f[1] + '</td><td>' + f[2] + '</td></tr>').join('') + '</table>' : '';
    window.RESULT = { total, fails };
  </script>
</body>
</html>
